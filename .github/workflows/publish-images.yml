# Builds and publishes the container images, so releases do not depend on
# whichever machine happens to have the source checked out.
#
# Triggered by pushing a version tag, or manually from the Actions tab. Nothing
# needs configuring: GITHUB_TOKEN already has permission to write packages for
# this repository.
name: Publish images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: hairdresser-booking-api
            dockerfile: apps/api/Dockerfile
          - name: hairdresser-booking-web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # A semver tag produces 1.2.3, 1.2 and latest; anything else produces
          # the short commit sha, so every image traces back to its source.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs so a small change does not rebuild
          # everything from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
