# Build overrides, used from a machine that has the source checked out.
#
# compose.yml on its own only ever pulls images, which is what the server does.
# Layering this file on top adds the build contexts, so the same image references
# can be built and pushed:
#
#   docker compose -f compose.yml -f compose.build.yml build
#   docker compose -f compose.yml -f compose.build.yml push
#
# Set IMAGE_TAG so the result is traceable to a commit. Normally releases are
# built by GitHub Actions instead; see .github/workflows/publish-images.yml.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
