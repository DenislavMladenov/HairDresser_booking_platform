# Production stack: PostgreSQL, the API, and Caddy in front.
#
# Runs with no configuration at all. On any host:
#
#   docker compose up -d
#
# and the app answers on port 80 for whatever address that host has. Secrets are
# generated on first start and kept in a volume. There is no .env to write, no
# domain to declare and no origin to whitelist, because the API derives the
# expected origin from each request.
#
# Podman works too. Nothing here depends on being started in a particular order,
# so implementations that ignore `depends_on` conditions still bring the stack up;
# containers wait for what they need instead. Rootless Podman cannot bind port 80,
# so set HTTP_PORT to something above 1024. See the README.
#
# The long-running services say `restart: always` rather than `unless-stopped`
# because podman-restart.service, which is what brings containers back after a
# reboot, only starts containers whose policy is exactly `always`. Docker treats
# the two almost identically, so the stricter of the pair is the portable choice.
#
# Set DOMAIN to a real hostname when you want a public deployment with automatic
# HTTPS. Everything else in .env.example is optional tuning.
#
# Only Caddy publishes ports. PostgreSQL sits on a network Caddy cannot reach, so
# it is unreachable both from the internet and from the public-facing container.
name: booking

services:
  # Generates the database password and the session secret once, then exits.
  # Values already supplied through the environment are used instead, so an
  # existing deployment keeps its credentials.
  init-secrets:
    image: alpine:3.22
    environment:
      SEED_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      SEED_SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - secrets:/secrets
    command:
      - sh
      - -c
      - |
        set -eu
        # Characters that would need escaping in a connection string are removed.
        generate() { head -c "$$1" /dev/urandom | base64 | tr -d '\n=+/'; }

        if [ ! -f /secrets/postgres_password ]; then
          if [ -n "$${SEED_POSTGRES_PASSWORD}" ]; then
            printf '%s' "$${SEED_POSTGRES_PASSWORD}" > /secrets/postgres_password
            echo 'database password taken from the environment'
          else
            generate 24 > /secrets/postgres_password
            echo 'database password generated'
          fi
        fi

        if [ ! -f /secrets/session_secret ]; then
          if [ -n "$${SEED_SESSION_SECRET}" ]; then
            printf '%s' "$${SEED_SESSION_SECRET}" > /secrets/session_secret
            echo 'session secret taken from the environment'
          else
            generate 48 > /secrets/session_secret
            echo 'session secret generated'
          fi
        fi

        # PostgreSQL and the API run as different unprivileged users, so rather
        # than guess at their user ids the files are readable inside the volume.
        # That volume is mounted only into this stack's own containers, and each
        # consumer would otherwise receive the same value as an environment
        # variable, so this exposes nothing further.
        chmod 444 /secrets/postgres_password /secrets/session_secret

        echo 'secrets ready'
    restart: 'no'

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Deterministic collation regardless of the host locale.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    # Waits for the generated password instead of assuming the generator already
    # ran. Podman's Compose implementations do not all honour the condition
    # below, and starting in the wrong order should cost a few seconds rather
    # than fail.
    entrypoint:
      - sh
      - -c
      - |
        waited=0
        while [ ! -s /run/secrets/postgres_password ]; do
          if [ "$$waited" -ge 120 ]; then
            echo 'Still no generated password; exiting so the restart policy tries again.' >&2
            exit 1
          fi
          [ "$$waited" -eq 0 ] && echo 'Waiting for the generated database password...'
          sleep 2
          waited=$$((waited + 2))
        done
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - secrets:/run/secrets:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # A 4 GB host also runs the API and Caddy; keep Postgres from taking it all.
    # mem_limit rather than deploy.resources, because podman-compose honours the
    # former and ignores the latter.
    mem_limit: 1g

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/denislavmladenov}/hairdresser-booking-api:${IMAGE_TAG:-latest}
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-log}
      # The entrypoint assembles DATABASE_URL from these unless one is supplied.
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
      POSTGRES_HOST: postgres
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
      # Deliberately not DATABASE_URL: in a checkout that variable points at the
      # development database on the host, which this container cannot reach, and
      # Compose would pick it up from .env automatically. Set this only to use a
      # database outside the stack.
      DATABASE_URL: ${EXTERNAL_DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Only for a client served from some other origin; normally empty, because
      # the app and the API share one.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Europe/Sofia}
      CURRENCY: ${CURRENCY:-EUR}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-barber_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # Caddy is the only way in, so its forwarded headers can be trusted. They
      # carry the client address for rate limiting and the protocol that decides
      # whether cookies are marked Secure.
      TRUST_PROXY: 'true'
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - edge
    mem_limit: 512m

  caddy:
    image: ${IMAGE_REGISTRY:-ghcr.io/denislavmladenov}/hairdresser-booking-web:${IMAGE_TAG:-latest}
    restart: always
    environment:
      # `:80` answers on any hostname over plain HTTP and requests no
      # certificate, which is what makes an unconfigured start work anywhere.
      # Replace with a real hostname for automatic HTTPS.
      DOMAIN: ${DOMAIN:-:80}
      # Never empty: Caddy treats an empty value as a syntax error rather than
      # falling back to a default. Irrelevant unless DOMAIN is a real hostname,
      # since plain HTTP contacts no certificate authority.
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      # Certificates must outlive the container or every restart re-issues them.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started
    networks:
      - edge
    mem_limit: 256m

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  # Generated credentials. Include this in backups, or a restored database will
  # not match a freshly generated password.
  secrets:

networks:
  # Caddy and the API. Reachable from outside only through Caddy's ports.
  edge:
  # The API and PostgreSQL. Deliberately not attached to Caddy.
  data:
    internal: true
